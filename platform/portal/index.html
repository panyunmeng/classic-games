<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0a0d16">
  <title>经典游戏合集</title>
  <link rel="stylesheet" href="./shared/theme.css">
  <link rel="stylesheet" href="./portal.css">
</head>
<body class="portal-body">
  <div class="portal" id="portal">
    <header class="portal-head">
      <div class="portal-brand">
        <div class="portal-logo" aria-hidden="true">CG</div>
        <div>
          <h1>经典游戏合集</h1>
          <p class="portal-sub">36 款经典玩法 · 电脑与手机同屏可玩</p>
        </div>
      </div>
      <div class="portal-tools">
        <input id="search" class="portal-search" type="search" placeholder="搜索游戏 / 拼音首字母" autocomplete="off" aria-label="搜索游戏">
      </div>
    </header>

    <nav class="portal-cats" id="cats" aria-label="分类"></nav>

    <section class="portal-recent" id="recent-wrap" hidden>
      <h2>最近游玩</h2>
      <div class="portal-recent-list" id="recent"></div>
    </section>

    <section class="portal-grid-wrap">
      <div class="portal-grid" id="grid"></div>
      <div class="portal-empty" id="empty" hidden>没有匹配的游戏</div>
    </section>

    <footer class="portal-foot">
      <span id="count"></span>
      <span class="portal-dot">·</span>
      <span>本机最高分保存在浏览器</span>
      <span class="portal-dot">·</span>
      <span id="version"></span>
    </footer>
  </div>
  <script type="module" src="./portal.js"></script>
</body>
</html>
